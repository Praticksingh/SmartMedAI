openapi: 3.0.3
info:
  title: DevFusion 4.0 API
  version: 0.1.0
  description: Phase 0 API skeleton for the DevFusion 4.0 platform.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
